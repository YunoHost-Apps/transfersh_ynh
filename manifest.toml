packaging_format = 2

id = "transfersh"
name = "Transfer.sh"
description.en = "Easy and fast file sharing from the command-line"
description.fr = "Partage de fichiers simple et rapide depuis la ligne de commande"

version = "1.7.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://transfer.sh/"
admindoc = "https://github.com/dutchcoders/transfer.sh/"
code = "https://github.com/dutchcoders/transfer.sh"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        arm64.url = "https://github.com/dutchcoders/transfer.sh/releases/download/v1.7.0/transfersh-v1.7.0-linux-arm64-v8a"
        arm64.sha256 = "a0a86915f7a80835543c4ae95e803d8576e8f6b08f0d81bde8e54be959c6e087"
        amd64.url = "https://github.com/dutchcoders/transfer.sh/releases/download/v1.7.0/transfersh-v1.7.0-linux-amd64"
        amd64.sha256 = "b92edea5d03abd804e580cb37c12b106519338933c30eb9cdd2914302c129274"
        armhf.url = "https://github.com/dutchcoders/transfer.sh/releases/download/v1.7.0/transfersh-v1.7.0-linux-armv7"
        armhf.sha256 = "39c72acc203a097a71134584ed24e217f90180f32bad680edb4d19bcb665ee01"
        in_subdir = false
        extract = false
        rename = "transfersh"

        autoupdate.strategy = "latest_github_release"
        autoupdate.asset.amd64 = "^transfersh-.*-linux-amd64$"
        autoupdate.asset.arm64 = "^transfersh-.*-linux-arm64-v8a$"
        autoupdate.asset.armhf = "^transfersh-.*-linux-armv7$"

    [resources.ports]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "curl"
